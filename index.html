<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SoundSnap — Guess the song</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#111;--s2:#181818;--s3:#202020;
  --border:#252525;--b2:#303030;
  --green:#d7263d;--green-h:#ff4d5e;--text:#f0f0f0;--t2:#999;--t3:#555;
  --red:#e74c3c;--yellow:#f39c12;--purple:#9b59b6;--orange:#e67e22;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
.shell{max-width:660px;margin:0 auto;padding:0 18px 40px}
header{padding:24px 0 14px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.5px}
.logo span{color:var(--green)}
.hstats{display:flex;gap:18px}
.hstat{text-align:center}
.hstat-n{font-size:18px;font-weight:600;font-family:'Space Grotesk',sans-serif}
.hstat-l{font-size:10px;color:var(--t3);letter-spacing:.05em;margin-top:1px}

/* Filter row */
.filter-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.excl-toggle{display:flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--t2);cursor:pointer;user-select:none}
.excl-toggle input{accent-color:var(--green);cursor:pointer}
.excl-toggle:has(input:checked){border-color:var(--green);color:var(--green)}
#genre-warning{background:#f39c1220;border:1px solid #f39c1260;border-radius:8px;padding:8px 12px;font-size:12.5px;color:#f39c12;margin-bottom:10px}
.filter-row select{flex:1;min-width:120px;background:var(--s2);border:1px solid var(--b2);border-radius:8px;color:var(--t2);padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer}
.filter-row select:focus{outline:none;border-color:var(--green)}

/* Difficulty */
.diff-row{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.diff-pill{flex:1;min-width:60px;padding:7px 4px;border-radius:20px;border:1px solid var(--b2);background:transparent;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;text-align:center;color:var(--t3)}
.diff-pill[data-d="easy"].active{background:#1db95420;border-color:#1db95460;color:#1db954}
.diff-pill[data-d="medium"].active{background:#f39c1220;border-color:#f39c1260;color:var(--yellow)}
.diff-pill[data-d="hard"].active{background:#e67e2220;border-color:#e67e2260;color:var(--orange)}
.diff-pill[data-d="expert"].active{background:#e74c3c20;border-color:#e74c3c60;color:var(--red)}
.diff-pill[data-d="impossible"].active{background:#9b59b620;border-color:#9b59b660;color:var(--purple)}
.diff-hint{font-size:11px;color:var(--t3);margin-bottom:12px;min-height:14px}

/* Start time toggle */
.start-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.start-lbl{font-size:12px;color:var(--t3)}
.start-btns{display:flex;gap:5px}
.start-btn{padding:5px 12px;border-radius:16px;border:1px solid var(--b2);background:transparent;color:var(--t3);font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
.start-btn.active{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}

/* Player */
.player{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.clip-row{display:flex;gap:5px;margin-bottom:16px}
.cp{flex:1;padding:6px 0;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--t3);font-size:11px;font-family:'Inter',sans-serif;cursor:default;transition:all .15s;text-align:center}
.cp.on{color:var(--t2);cursor:pointer}
.cp.cur{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.cp.done{background:var(--s2);color:var(--t3)}
.wf{display:flex;align-items:center;gap:2px;height:52px;margin-bottom:16px}
.wb{flex:1;border-radius:2px;background:var(--s3);transition:background .04s}
.wb.p{background:#d7263d55}.wb.a{background:var(--green)}
.play-row{display:flex;align-items:center;gap:14px}
.pbtn{width:52px;height:52px;border-radius:50%;background:var(--green);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .1s,background .1s}
.pbtn:hover{background:var(--green-h);transform:scale(1.04)}
.pbtn:active{transform:scale(.96)}
.tinfo{display:flex;flex-direction:column;gap:2px}
.tcur{font-size:20px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:var(--green)}
.ttot{font-size:11px;color:var(--t3)}
.status-txt{font-size:11px;color:var(--t3);margin-top:1px;min-height:14px}
.vol-row{display:flex;align-items:center;gap:6px;margin-left:auto}
.vol-ico{font-size:15px;color:var(--t2);flex-shrink:0}
.vol-row input[type=range]{-webkit-appearance:none;appearance:none;width:80px;height:4px;border-radius:2px;background:var(--b2);outline:none;cursor:pointer}
.vol-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:var(--green);cursor:pointer}
.vol-row input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--green);cursor:pointer}

/* Guesses */
.glist{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.gi{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:8px;font-size:13px}
.gi.wr{background:#e74c3c12;border:1px solid #e74c3c30;color:var(--red)}
.gi.sk{background:var(--s2);border:1px solid var(--border);color:var(--t3)}

/* Search */
.sw{position:relative;margin-bottom:9px}
.si{width:100%;padding:11px 14px 11px 40px;background:var(--s2);border:1px solid var(--b2);border-radius:10px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;transition:border-color .15s}
.si:focus{outline:none;border-color:var(--green)}
.sico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:15px;pointer-events:none}
.sdrop{position:absolute;top:calc(100%+4px);left:0;right:0;background:var(--s2);border:1px solid var(--b2);border-radius:10px;overflow:hidden;z-index:20;max-height:220px;overflow-y:auto;box-shadow:0 8px 24px #0008}
.sdi{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.sdi:last-child{border-bottom:none}
.sdi:hover{background:var(--s3)}
.sdi-t{font-size:13px;font-weight:500}
.sdi-m{font-size:11px;color:var(--t3);margin-top:1px}

.arow{display:flex;gap:8px;flex-wrap:wrap}
.brerl{flex:1;padding:10px;background:transparent;border:1px solid var(--b2);border-radius:9px;color:var(--t2);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
.brerl:hover{border-color:var(--green);color:var(--green)}
.bskip{flex:1;padding:10px;background:transparent;border:1px solid var(--b2);border-radius:9px;color:var(--t2);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
.bskip:hover{border-color:var(--t3);color:var(--text)}
.bguess{flex:2;padding:10px;background:var(--green);border:none;border-radius:9px;color:#fff;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}
.bguess:hover{background:var(--green-h)}

/* Result */
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center}
.album-art{width:80px;height:80px;border-radius:8px;margin:0 auto 12px;display:block;object-fit:cover;background:var(--s2)}
.rsong{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;margin-bottom:3px}
.rart{font-size:13px;color:var(--t2);margin-bottom:14px}
.rbadges{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.rb{padding:4px 11px;border-radius:20px;font-size:11px;border:1px solid}
.rb-g{background:#d7263d15;border-color:#d7263d45;color:var(--green)}
.rb-r{background:#e74c3c15;border-color:#e74c3c45;color:var(--red)}
.rb-n{background:var(--s2);border-color:var(--b2);color:var(--t2)}
.ract{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.byt{padding:9px 16px;background:transparent;border:1px solid var(--b2);border-radius:8px;color:var(--t2);font-size:13px;text-decoration:none;font-family:'Inter',sans-serif;transition:all .15s}
.byt:hover{border-color:var(--t3);color:var(--text)}
.bnext{padding:9px 20px;background:var(--green);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}
.bnext:hover{background:var(--green-h)}

.no-song{text-align:center;padding:20px;color:var(--t3);font-size:13px}
.bplay{padding:9px 16px;background:var(--s2);border:1px solid var(--b2);border-radius:8px;color:var(--t2);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
.bplay:hover{border-color:var(--green);color:var(--green)}
.bplay.playing{border-color:var(--green);color:var(--green);background:#d7263d18}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="logo">Sound<span>Snap</span></div>
    <div class="hstats">
      <div class="hstat"><div class="hstat-n" id="sc">0</div><div class="hstat-l">correct</div></div>
      <div class="hstat"><div class="hstat-n" id="ss">0</div><div class="hstat-l">streak</div></div>
      <div class="hstat"><div class="hstat-n" id="sp">0</div><div class="hstat-l">played</div></div>
    </div>
  </header>

  <div class="filter-row">
    <select id="sel-genre">
      <option value="all">🎵 All genres</option>
      <option value="pop">🎤 Pop</option>
      <option value="hiphop">🎧 Hip-hop &amp; Rap</option>
      <option value="rnb">🎶 R&amp;B &amp; Soul</option>
      <option value="rock">🎸 Rock</option>
      <option value="electronic">🎛️ Electronic</option>
      <option value="roots">🪕 Roots</option>
      <option value="jazzclassical">🎷 Jazz &amp; Classical</option>
      <option value="latin">🌴 Latin</option>
      <option value="kpop">🇰🇷 K-pop</option>
      <option value="jpop">🎌 J-pop &amp; Anime</option>
      <option value="global">🌍 Global</option>
      <option value="fifa">⚽ FIFA / EA FC &amp; World Cup</option>
      <option value="other">🎬 Soundtracks &amp; More</option>
    </select>
    <select id="sel-era">
      <option value="">Any era</option>
      <option value="1990">1990s</option>
      <option value="2000">2000s</option>
      <option value="2010">2010s</option>
      <option value="2020">2020s</option>
    </select>
  </div>
  <div class="filter-row">
    <label class="excl-toggle" id="excl-toggle" title="Filters out country/folk/blues/reggae no matter which genre is picked above">
      <input type="checkbox" id="excl-roots"/> 🚫 No Country/Roots
    </label>
  </div>
  <div id="genre-warning" style="display:none"></div>

  <!-- Difficulty -->
  <div class="diff-row" id="diff-row">
    <button class="diff-pill active" data-d="easy">Easy</button>
    <button class="diff-pill" data-d="medium">Medium</button>
    <button class="diff-pill" data-d="hard">Hard</button>
    <button class="diff-pill" data-d="expert">Expert</button>
    <button class="diff-pill" data-d="impossible">Impossible</button>
  </div>
  <div class="diff-hint" id="diff-hint"></div>

  <!-- Start time -->
  <div class="start-row">
    <span class="start-lbl">Start song at:</span>
    <div class="start-btns">
      <button class="start-btn active" data-s="0">Beginning</button>
      <button class="start-btn" data-s="30">30s in</button>
    </div>
  </div>

  <!-- Player -->
  <div class="player">
    <div class="clip-row" id="clip-row"></div>
    <div class="wf" id="wf"></div>
    <div class="play-row">
      <button class="pbtn" id="pbtn" aria-label="Play clip">&#9654;</button>
      <div class="tinfo">
        <div class="tcur" id="tcur">0.0s</div>
        <div class="ttot" id="ttot">of 0.1s</div>
        <div class="status-txt" id="status-txt">Loading...</div>
      </div>
      <div class="vol-row" title="Volume">
        <span class="vol-ico">&#128266;</span>
        <input type="range" id="volume" min="0" max="100" value="80"/>
      </div>
    </div>
  </div>

  <div class="glist" id="glist"></div>

  <div id="game-area">
    <div class="sw">
      <span class="sico">&#128269;</span>
      <input class="si" id="ginput" placeholder="Search song or artist..." autocomplete="off"/>
      <div class="sdrop" id="sdrop" style="display:none"></div>
    </div>
    <div class="arow">
      <button class="bskip" id="bskip">Skip</button>
      <button class="bguess" id="bguess">Guess</button>
      <button class="brerl" id="breroll" title="Get a different song at this difficulty">🔀 Reroll</button>
      <button class="brerl" id="brerollall" title="Get a different song on every difficulty">🎲 Reroll All</button>
    </div>
  </div>

  <div id="result-area" style="display:none"></div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────

// ── Genre matching ─────────────────────────────────────────────
// Use the per-genre keyword lists already defined on GENRE_CONFIG (they're
// correctly curated and keyed to the actual genre values, e.g. 'hiphop',
// 'rnb'). Previously this used a separate, mismatched keyword table (keys
// like 'hip-hop' / 'r-b-soul' that never matched the real 'hiphop' / 'rnb'
// values), so genre filtering silently failed for nearly every genre and
// fell back to including songs from any genre — which is how e.g. an R&B
// song could end up classified as hip-hop.
function genreMatches(song, genre){
  if(genre==='all'||genre==='fifa') return true;
  const cfg = GENRE_CONFIG[genre];
  const keywords = (cfg && cfg.keywords && cfg.keywords.length) ? cfg.keywords : [genre.replace(/-/g,' ')];
  const songGenre = (song.primaryGenreName||'').toLowerCase();
  return keywords.some(kw=>songGenre.includes(kw));
}

// ── iTunes API ──────────────────────────────────────────────────
const ERA_RANGES = {
  '1950':[1950,1959],'1960':[1960,1969],'1970':[1970,1979],
  '1980':[1980,1989],'1990':[1990,1999],'2000':[2000,2009],
  '2010':[2010,2019],'2020':[2020,2029]
};
function songInEra(song, era){
  const yearRange = era ? ERA_RANGES[era] : null;
  if(!yearRange) return true;
  const raw = song.releaseDate||'';
  const year = parseInt(raw.substring(0,4));
  if(isNaN(year)) return true; // can't tell, include it
  return year >= yearRange[0] && year <= yearRange[1];
}

// Normalize a title/artist for loose comparison when matching a curated
// song entry against iTunes search results (handles case, punctuation,
// and "feat."/bracketed suffixes).
function normForMatch(s){
  return (s||'')
    .toLowerCase()
    .replace(/\(feat[^)]*\)/g,'')
    .replace(/\[[^\]]*\]/g,'')
    .replace(/[^a-z0-9]/g,'');
}

// Look up one curated {t: title, a: artist} entry on iTunes and return the
// best-matching result (or null if nothing close enough was found).
async function fetchCuratedSong(entry, attempt=0){
  try{
    const url=`https://itunes.apple.com/search?term=${encodeURIComponent(entry.t+' '+entry.a)}&mediaType=music&limit=5&entity=song`;
    const res=await fetch(url);
    if(!res.ok) throw new Error('iTunes search HTTP '+res.status);
    const data=await res.json();
    const results=(data.results||[]).filter(s=>s.previewUrl&&s.trackName&&s.artistName);
    const nTitle=normForMatch(entry.t), nArtist=normForMatch(entry.a);
    // Prefer a result whose title matches closely and whose artist credit
    // contains the artist we searched for (credits often list multiple
    // featured artists, so use "includes" rather than exact equality).
    let best = results.find(s=>{
      const st=normForMatch(s.trackName), sa=normForMatch(s.artistName);
      return (st===nTitle||st.includes(nTitle)||nTitle.includes(st)) && sa.includes(nArtist);
    });
    if(!best) best = results[0]||null;
    return best;
  }catch(e){
    if(attempt<2){
      await new Promise(r=>setTimeout(r, 300*(attempt+1)));
      return fetchCuratedSong(entry, attempt+1);
    }
    return null;
  }
}

// Some genre+era combos are historically almost empty — hip-hop as a
// recorded genre barely existed before late 1979, for instance — so a
// generic search often can't find genuinely-of-that-genre songs no matter
// how it's phrased. This is a small curated list of guaranteed-real songs
// for those specific gaps, looked up individually on iTunes the same way
// as the FIFA/EA FC list, and prioritized ahead of the generic fallback.
const ERA_GAP_FILLERS = {
  'hiphop|1970': [
    {t:'King Tim III (Personality Jock)', a:'The Fatback Band'},
    {t:"Rapper's Delight", a:'The Sugarhill Gang'},
    {t:"Christmas Rappin'", a:'Kurtis Blow'},
  ],
};

// Run an array of no-arg async thunks with limited concurrency instead of
// firing everything at once via Promise.all. This is the real fix for
// "genres come back empty after switching a few times": each pool load
// was firing 25-50+ simultaneous iTunes requests, and doing that
// repeatedly in a short session is exactly what trips iTunes' rate
// limiting. Batching keeps each burst small regardless of how many times
// you've already switched genres this session.
async function runThrottled(thunks, batchSize=8, delayMs=150){
  const results=[];
  for(let i=0;i<thunks.length;i+=batchSize){
    const batch=thunks.slice(i,i+batchSize);
    results.push(...await Promise.all(batch.map(fn=>fn())));
    if(i+batchSize<thunks.length) await new Promise(r=>setTimeout(r,delayMs));
  }
  return results;
}

// Bumped whenever a new pool load starts. If a slower, older load finishes
// after a newer one has already started, its result is discarded instead
// of clobbering the current state — prevents overlapping genre/era
// switches from compounding into an even bigger request burst than
// throttling alone would already prevent.
let loadGen = 0;

async function fetchSongs(genre, era){
  const cacheKey=genre+'|'+era;
  if(searchCache[cacheKey]) return searchCache[cacheKey];

  setStatus('Finding songs...');
  const cfg = GENRE_CONFIG[genre]||GENRE_CONFIG.all;

  // FIFA / EA FC & World Cup: curated song list, looked up individually
  // instead of filtered by genre tag (these soundtracks span every genre).
  if(cfg.curated){
    setStatus('Loading FIFA & World Cup tracks...');
    const found = await runThrottled(cfg.curated.map(entry=>()=>fetchCuratedSong(entry)));
    const seen = new Set();
    let allSongs = [];
    for(const s of found){
      if(!s||seen.has(s.trackId)) continue;
      if(!songInEra(s, era)) continue;
      seen.add(s.trackId);
      allSongs.push(s);
    }
    searchCache[cacheKey] = allSongs;
    return allSongs;
  }

  const eraTerms = {'1950':'1950s','1960':'1960s','1970':'1970s','1980':'1980s','1990':'1990s','2000':'2000s','2010':'2010s','2020':'2020s'};
  const eraTerm = (era && eraTerms[era]) ? eraTerms[era] : '';

  let allSongs = [];

  // Use everything configured for this genre — previously these were
  // truncated to a few terms/IDs even when a genre had more defined
  // (e.g. Rock has 5 genre IDs and 6 terms but only 2/4 were ever used).
  const searchTerms = cfg.terms;
  const genreIds = cfg.ids;
  const LIMIT = 200; // iTunes Search API's actual documented max (was 100)

  const fetches = [];
  const searchUrl = async (term, extra='', attempt=0) => {
    try{
      const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&mediaType=music&limit=${LIMIT}&entity=song${extra}`);
      // Same class of bug as the search-bar fix: fetch() only rejects on
      // a true network failure. An HTTP-level error (e.g. a 429 rate-
      // limit from the burst of ~20-25 concurrent requests a pool load
      // fires at once) still comes back as a normal response with no
      // `results` field, which silently became "zero songs" with no
      // retry at all — this is what could make an entire genre look empty.
      if(!res.ok) throw new Error('iTunes search HTTP '+res.status);
      const data = await res.json();
      return data.results||[];
    }catch(e){
      if(attempt<2){
        await new Promise(r=>setTimeout(r, 300*(attempt+1)));
        return searchUrl(term, extra, attempt+1);
      }
      return [];
    }
  };

  if(era && ERA_RANGES[era]){
    // iTunes search is relevance-based, not a real chart/decade browser —
    // a single "2010s hip hop" query tends to keep surfacing the same
    // handful of most "relevant" hits no matter how the phrase is varied.
    // Querying each individual year spreads the results out and pulls in
    // a much wider, less repetitive set of songs from across the decade.
    const [startYear, endYear] = ERA_RANGES[era];
    const yearTerms = searchTerms.slice(0, 2);
    for(let y=startYear; y<=endYear; y++){
      for(const term of yearTerms){
        fetches.push(()=>searchUrl(y+' '+term));
      }
    }
    // Broader decade-phrase queries across every configured term
    for(const term of searchTerms){
      fetches.push(()=>searchUrl(eraTerm+' '+term));
    }
    // genreId queries sampled across a few years in the decade, across
    // every genre ID this category has (not just the first couple)
    for(const gid of genreIds){
      for(const y of [startYear, Math.floor((startYear+endYear)/2), endYear]){
        fetches.push(()=>searchUrl(String(y), `&genreId=${gid}`));
      }
    }
  }else{
    // No era filter — still spread a couple of terms across a sample of
    // years spanning music history, the same trick used for a specific
    // decade, so "Any era" doesn't lean entirely on a handful of the
    // most generically "relevant" (usually current) hits either.
    const sampleYears = [1958,1965,1975,1985,1995,2005,2015,2020,2024,2026];
    const yearTerms = searchTerms.slice(0, 2);
    for(const y of sampleYears){
      for(const term of yearTerms){
        fetches.push(()=>searchUrl(y+' '+term));
      }
    }
    for(const term of searchTerms){
      fetches.push(()=>searchUrl(term));
    }
    for(const gid of genreIds){
      const q = searchTerms[0]||genre;
      fetches.push(()=>searchUrl(q, `&genreId=${gid}`));
    }
  }

  const results = await runThrottled(fetches);

  // Merge + rank. Songs that turn up across more of our search queries,
  // and rank higher (closer to the top) within them, are a reasonable
  // proxy for "more well-known" — iTunes search puts more prominent/
  // popular results first for a given query. This ordering is what
  // filterByDiff() below relies on to make "Easy" mean "actually easy"
  // rather than an arbitrary random slice of the pool.
  function rankSongs(matchFn){
    const meta = new Map(); // trackId -> {song, hits, bestIdx}
    for(const batch of results){
      batch.forEach((s, idx)=>{
        if(!s.previewUrl||!s.trackName||!s.artistName) return;
        if(!matchFn(s)) return;
        const m = meta.get(s.trackId);
        if(m){ m.hits++; if(idx<m.bestIdx) m.bestIdx=idx; }
        else meta.set(s.trackId, {song:s, hits:1, bestIdx:idx});
      });
    }
    return Array.from(meta.values())
      .sort((a,b)=>(b.hits-a.hits)||(a.bestIdx-b.bestIdx))
      .map(m=>m.song);
  }

  allSongs = rankSongs(s=>genreMatches(s, genre) && songInEra(s, era));

  // Fill in known historical gaps with guaranteed-real songs for this
  // specific genre+era combo (see ERA_GAP_FILLERS), looked up the same
  // way as the FIFA curated list. These are genuinely of the right genre,
  // so they're prioritized ahead of the generic search results.
  if(ERA_GAP_FILLERS[cacheKey]){
    const filler = await runThrottled(ERA_GAP_FILLERS[cacheKey].map(entry=>()=>fetchCuratedSong(entry)));
    const seenIds = new Set(allSongs.map(s=>s.trackId));
    const newOnes = [];
    for(const s of filler){
      if(s && !seenIds.has(s.trackId)){ seenIds.add(s.trackId); newOnes.push(s); }
    }
    allSongs = newOnes.concat(allSongs);
  }

  // If strict filter left too few, relax genre but keep era strict.
  // Flag this on the result so the UI can be upfront about it — some
  // genre+era combos are just historically near-empty (there's barely
  // any real hip-hop from the 1970s, for instance), and silently filling
  // the gap with unrelated songs is confusing without a note explaining why.
  const strictCount = allSongs.length;
  if(strictCount < 10){
    const relaxed = rankSongs(s=>songInEra(s, era));
    const seen = new Set(allSongs.map(s=>s.trackId));
    for(const s of relaxed){
      if(!seen.has(s.trackId)){ seen.add(s.trackId); allSongs.push(s); }
    }
  }
  allSongs.relaxedInfo = (strictCount < 10) ? {strictCount} : null;

  searchCache[cacheKey] = allSongs;
  return allSongs;
}

async function searchForGuess(query, attempt){
  attempt = attempt||0;
  if(!query) return [];
  try {
    const url=`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&mediaType=music&limit=12&entity=song`;
    const res=await fetch(url);
    // fetch() only rejects on a true network failure — an HTTP-level
    // error (e.g. a 429 rate-limit after the burst of requests pool
    // loading makes) still comes back as a normal, parseable response
    // with no `results` field, which silently became "no results" with
    // no exception ever thrown, and no retry. Checking res.ok explicitly
    // fixes that: this is what made a correctly-spelled search seem to
    // randomly show nothing.
    if(!res.ok) throw new Error('iTunes search HTTP '+res.status);
    const data=await res.json();
    return (data.results||[]).filter(s=>s.trackName&&s.artistName);
  } catch(e){
    // Retry a couple of times with a short backoff — iTunes occasionally
    // hiccups or briefly rate-limits after a burst of requests.
    if(attempt<2){
      await new Promise(r=>setTimeout(r, 300*(attempt+1)));
      return searchForGuess(query, attempt+1);
    }
    return [];
  }
}

function stopAudio(){

  clearTimeout(stopTO);clearTimeout(tickTO);clearInterval(waveAnim);
  isPlaying=false;
  document.getElementById('pbtn').innerHTML='&#9654;';

function setStatus(txt){ document.getElementById('status-txt').textContent=txt||''; }

// ── Correct-answer ding ─────────────────────────────────────────
let dingCtx=null;
function playDing(){
  try{
    dingCtx = dingCtx || new (window.AudioContext||window.webkitAudioContext)();
    const ctx=dingCtx, now=ctx.currentTime;
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.exponentialRampToValueAtTime(1318.5, now+0.1);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.28, now+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+0.4);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now+0.42);
  }catch(e){}
}

async function playClip(){
  if(!curSong) return;
  if(isPlaying){stopAudio();return;}

  const dur = gameFinished ? 15 : DIFFS[selDiff].clips[clipIdx];

  if(!audio || audio.dataset.src !== curSong.previewUrl){
    audio = new Audio();
    audio.crossOrigin='anonymous';
    audio.dataset.src = curSong.previewUrl;
    audio.src = curSong.previewUrl;
    audio.volume = volume;
    audio.preload = 'auto';
    setStatus('Loading audio...');
    try { await audio.load(); } catch(e){}
  }

  setStatus('');

  // Wait for real metadata (a known duration) before seeking. Setting
  // currentTime too early — before the browser actually knows the
  // track's duration — can silently fail or get clamped in some
  // browsers, which is what made "Beginning" occasionally not really
  // land on the start of the clip.
  await new Promise(resolve=>{
    if(audio.readyState>=1 && !isNaN(audio.duration)){ resolve(); return; }
    audio.addEventListener('loadedmetadata', resolve, {once:true});
    setTimeout(resolve, 3000); // fallback timeout
  });

  // Seek to start offset — iTunes previews are 30s so cap at 15s for "30s in" mode
  const maxSeek = Math.max(0, (audio.duration||30) - 15);
  const seekTo = Math.min(startOffset, maxSeek);
  audio.currentTime = seekTo;

  // Wait for enough buffered data to actually play from that position,
  // then double-check the seek actually landed — re-apply it if the
  // browser drifted or ignored it, instead of just hoping for the best.
  await new Promise(resolve=>{
    if(audio.readyState>=2){ resolve(); return; }
    audio.addEventListener('canplay', resolve, {once:true});
    setTimeout(resolve, 3000);
  });
  if(Math.abs(audio.currentTime-seekTo) > 0.75){
    audio.currentTime = seekTo;
  }

  try { await audio.play(); } catch(e){ setStatus('Audio blocked — click again'); return; }

  isPlaying=true;
  document.getElementById('pbtn').innerHTML='&#9646;&#9646;';

  // Waveform animation
  const bars=document.querySelectorAll('.wb');
  const n=bars.length;
  let elapsed=0;
  clearInterval(waveAnim);
  bars.forEach(b=>b.classList.remove('p','a'));
  waveAnim=setInterval(()=>{
    elapsed+=50;
    const prog=Math.min(elapsed/(dur*1000),1);
    const idx=Math.floor(prog*n);
    bars.forEach((b,i)=>{b.classList.remove('p','a');if(i<idx)b.classList.add('p');else if(i===idx)b.classList.add('a');});
  },50);

  // Tick timer
  let t=0;
  const tick=()=>{t=Math.min(t+0.1,dur);document.getElementById('tcur').textContent=t.toFixed(1)+'s';if(t<dur)tickTO=setTimeout(tick,100);};
  tick();

  // Auto-stop after clip duration
  stopTO=setTimeout(()=>{stopAudio();document.getElementById('tcur').textContent=dur.toFixed(1)+'s';},dur*1000);
}

// ── Search (live iTunes) ────────────────────────────────────────
let searchTO=null;
let searchSeq=0;

function buildSearch(){
  const inp=document.getElementById('ginput');
  const dd=document.getElementById('sdrop');
  inp.value='';dd.style.display='none';
  inp.oninput=()=>{
    clearTimeout(searchTO);
    const q=inp.value.trim();
    // Require a couple characters — a single letter matches too broadly
    // (mostly irrelevant results) and risks surfacing the answer before
    // the player has actually typed enough to have found it themselves.
    if(q.length<2){dd.style.display='none';return;}
    // Short debounce so results feel near-instant after each keystroke,
    // while still not firing a request per single keypress on fast typers.
    const mySeq=++searchSeq;
    searchTO=setTimeout(async()=>{
      const results=await searchForGuess(q);
      // Ignore this response if a newer keystroke has already superseded
      // it — without this, a slower response to an earlier letter could
      // land after a faster one and show stale results, which is what
      // made the dropdown feel like it was randomly bugging out.
      if(mySeq!==searchSeq) return;
      // NOTE: we intentionally do NOT filter out the current song here.
      // If the player has typed enough of the real title/artist for it to
      // legitimately show up in results, that's them finding the answer
      // themselves — hiding it just leaves a list of only-wrong options.
      showDropdown(results.slice(0,9), dd);
    }, 150);
  };
}

function showDropdown(songs, dd){
  if(!songs.length){dd.style.display='none';return;}
  dd.innerHTML='';dd.style.display='block';
  songs.forEach(s=>{
    const item=document.createElement('div');item.className='sdi';
    item.innerHTML=`<div class="sdi-t">${s.trackName}</div><div class="sdi-m">${s.artistName} &bull; ${s.collectionName||''}</div>`;
    item.onclick=()=>{
      document.getElementById('ginput').value=s.trackName+' \u2014 '+s.artistName;
      dd.style.display='none';
    };
    dd.appendChild(item);
  });
}

// ── Game logic ──────────────────────────────────────────────────
function skip(){
  guesses.push({sk:true});renderGuesses();stopAudio();
  const clips=DIFFS[selDiff].clips;
  if(clipIdx<clips.length-1){clipIdx++;updateClips();}
  else endGame(false);
  document.getElementById('ginput').value='';
  document.getElementById('sdrop').style.display='none';
}

function doGuess(){
  const val=document.getElementById('ginput').value.trim();
  if(!val)return;
  const title=curSong.trackName.toLowerCase();
  const input=val.toLowerCase().split('\u2014')[0].trim();
  const won=title.includes(input)||input.includes(title)||
            (input.length>3&&title.replace(/[^a-z0-9]/g,'').includes(input.replace(/[^a-z0-9]/g,'')));
  if(won){stopAudio();endGame(true);}
  else{
    guesses.push({text:val,sk:false});renderGuesses();stopAudio();
    const clips=DIFFS[selDiff].clips;
    if(clipIdx<clips.length-1){clipIdx++;updateClips();}
    else endGame(false);
    document.getElementById('ginput').value='';
    document.getElementById('sdrop').style.display='none';
  }
}

// ── Result card listen button ──────────────────────────────────
let resultAudio = null;
let resultPlayTO = null;

function toggleResultPlay(btn, url){
  // If already playing this preview, pause it
  if(resultAudio && !resultAudio.paused){
    resultAudio.pause();
    clearTimeout(resultPlayTO);
    btn.textContent = '▶ Listen (15s)';
    btn.classList.remove('playing');
    return;
  }
  // Create or reuse audio
  if(!resultAudio || resultAudio.dataset.src !== url){
    if(resultAudio) resultAudio.pause();
    resultAudio = new Audio(url);
    resultAudio.dataset.src = url;
    resultAudio.volume = volume;
  }
  resultAudio.currentTime = 0;
  resultAudio.play().catch(()=>{});
  btn.textContent = '⏸ Pause';
  btn.classList.add('playing');
  clearTimeout(resultPlayTO);
  // Auto-stop after 15s
  resultPlayTO = setTimeout(()=>{
    if(resultAudio) resultAudio.pause();
    btn.textContent = '▶ Listen again';
    btn.classList.remove('playing');
  }, 15000);
  // Also listen for natural end
  resultAudio.onended = ()=>{
    btn.textContent = '▶ Listen again';
    btn.classList.remove('playing');
    clearTimeout(resultPlayTO);
  };
}

function endGame(won){
  stopAudio();
  if(won) playDing();
  stats.p++;if(won){stats.c++;stats.s++;}else stats.s=0;
  document.getElementById('sc').textContent=stats.c;
  document.getElementById('ss').textContent=stats.s;
  document.getElementById('sp').textContent=stats.p;
  document.getElementById('game-area').style.display='none';
  // Mark game as finished so play button plays full 15s reveal
  gameFinished = true;
  // Update clip pills to show 15s as current
  document.querySelectorAll('.cp').forEach((b,i)=>{
    b.className='cp on'+(i===DIFFS[selDiff].clips.length-1?' cur':'');
  });
  document.getElementById('ttot').textContent='of 15s';
  document.getElementById('tcur').textContent='0.0s';
  // Auto-play the 15s reveal after a short delay so the result card renders first
  setTimeout(()=>playClip(), 400);
  const attempts=guesses.length+(won?1:0);
  const art=curSong.artworkUrl100||(curSong.artworkUrl60||'');
  const bigArt=art.replace('100x100','300x300');

  const ra=document.getElementById('result-area');
  ra.style.display='block';
  const previewUrl = curSong.previewUrl||'';
  ra.innerHTML=`<div class="rcard">
    ${bigArt?`<img class="album-art" src="${bigArt}" alt="Album art"/>`:''}
    <div class="rsong">${curSong.trackName}</div>
    <div class="rart">${curSong.artistName} &bull; ${curSong.collectionName||''}</div>
    <div class="rbadges">
      ${won?`<span class="rb rb-g">Got it in ${attempts} guess${attempts!==1?'es':''}</span>`:'<span class="rb rb-r">Missed this one</span>'}
      <span class="rb rb-n">Clip: ${DIFFS[selDiff].clips[clipIdx]}s</span>
      <span class="rb rb-n">${selDiff}</span>
    </div>
    <div class="ract">
      <a class="byt" href="${curSong.trackViewUrl}" target="_blank" rel="noopener">iTunes</a>
      <button class="bnext" onclick="nextSong()">🔀 Reroll</button>
      <button class="brerl" onclick="rerollAll()" title="Get a different song on every difficulty">🎲 Reroll All</button>
    </div>
  </div>`;
}

// ── Song picking ────────────────────────────────────────────────
function filterByDiff(songs){
  // Easy = top 25%, impossible = all
  if(selDiff==='easy') return songs.slice(0, Math.max(20, Math.floor(songs.length*0.25)));
  if(selDiff==='medium') return songs.slice(0, Math.max(40, Math.floor(songs.length*0.5)));
  if(selDiff==='hard') return songs.slice(0, Math.max(60, Math.floor(songs.length*0.75)));
  return songs; // expert / impossible = all
}

function isRootsGenre(song){
  const kws = GENRE_CONFIG.roots.keywords;
  const g = (song.primaryGenreName||'').toLowerCase();
  return kws.some(k=>g.includes(k));
}

async function loadPool(){
  const myGen = ++loadGen;
  setStatus('Loading songs...');
  let pool = await fetchSongs(selGenre, selEra);
  if(myGen!==loadGen){
    // A newer genre/era switch started while this one was still in
    // flight — its own loadPool() call will apply the current
    // selection's result, so just bail out here instead of clobbering it.
    return false;
  }
  if(exclRoots && selGenre!=='roots'){
    pool = pool.filter(s=>!isRootsGenre(s));
  }
  // Let the player know when this genre+era combo doesn't actually have
  // enough real matches and we had to fall back to other genres from the
  // same era just to fill the pool — some combos are historically
  // near-empty (there's barely any real hip-hop from the 1970s, for
  // instance), so songs from other genres showing up isn't a bug.
  const warn = document.getElementById('genre-warning');
  if(pool.relaxedInfo && selEra){
    const genreLabel = document.querySelector(`#sel-genre option[value="${selGenre}"]`)?.textContent.trim() || selGenre;
    const eraLabel = document.querySelector(`#sel-era option[value="${selEra}"]`)?.textContent.trim() || selEra;
    const n = pool.relaxedInfo.strictCount;
    warn.textContent = n>0
      ? `⚠️ Only ${n} real ${genreLabel} song${n!==1?'s':''} found for ${eraLabel} — filling the rest with popular songs from that era instead.`
      : `⚠️ No real ${genreLabel} songs found for ${eraLabel} — showing popular songs from that era instead.`;
    warn.style.display='block';
  }else{
    warn.style.display='none';
  }
  // NOTE: intentionally NOT shuffling this array. It's already ordered
  // most-to-least "well-known" (see rankSongs in fetchSongs), and
  // filterByDiff() below slices from the front of it to build difficulty
  // tiers. Shuffling here would scramble that ordering and make every
  // difficulty an arbitrary random slice instead of an actual difficulty.
  // Randomness in what order you actually get songs within a tier is
  // handled separately, per-difficulty, by the shuffle bag in pickSong().
  songPool = pool;
  if(!songPool.length){
    setStatus('No songs found — try another genre');
    return false;
  }
  pickQueues={};
  diffStates={};
  recentlyPlayed=new Set();
  setStatus('');
  return true;
}

// Shuffle-bag song picker: works through every song in the current
// filtered pool exactly once, in random order, before any repeats.
// A separate bag is kept per genre+era+difficulty combo (in pickQueues),
// so switching difficulty and back doesn't reset or collide with another
// difficulty's progress through its own pool.
function shuffledIndices(n){
  const arr=Array.from({length:n},(_,i)=>i);
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function pickSong(){
  const filtered=filterByDiff(songPool);
  if(!filtered.length) return songPool[Math.floor(Math.random()*songPool.length)];
  const key=selGenre+'|'+selEra+'|'+selDiff+'|'+filtered.length;
  let pq=pickQueues[key];
  if(!pq){ pq={order:shuffledIndices(filtered.length),ptr:0,lastId:null}; pickQueues[key]=pq; }
  if(pq.ptr>=pq.order.length){
    pq.order=shuffledIndices(filtered.length);
    pq.ptr=0;
    if(filtered.length>1 && pq.lastId!=null && filtered[pq.order[0]].trackId===pq.lastId){
      [pq.order[0],pq.order[1]]=[pq.order[1],pq.order[0]];
    }
  }
  // Try to avoid recently played songs (up to 10 attempts)
  let song=null;
  for(let attempt=0;attempt<10;attempt++){
    if(pq.ptr>=pq.order.length){ pq.order=shuffledIndices(filtered.length); pq.ptr=0; }
    const candidate=filtered[pq.order[pq.ptr]];
    pq.ptr++;
    if(!recentlyPlayed.has(candidate.trackId)||recentlyPlayed.size>=filtered.length){
      song=candidate; break;
    }
  }
  if(!song) song=filtered[pq.order[Math.floor(Math.random()*pq.order.length)]];
  pq.lastId=song.trackId;
  // Keep recently played capped at 50
  recentlyPlayed.add(song.trackId);
  if(recentlyPlayed.size>50){
    const first=recentlyPlayed.values().next().value;
    recentlyPlayed.delete(first);
  }
  return song;
}

// Save whatever is currently on screen (song, guesses, finished/result
// state) as the saved round for the difficulty we're about to leave, so
// switching back later restores it exactly instead of losing progress.
function saveCurrentDiffState(){
  if(!curSong) return;
  const finished = document.getElementById('result-area').style.display!=='none';
  diffStates[selDiff] = {
    curSong, guesses:[...guesses], clipIdx, finished,
    resultHTML: finished ? document.getElementById('result-area').innerHTML : null
  };
  // Stop any playing audio when leaving this difficulty
  stopAudio();
  if(resultAudio){ resultAudio.pause(); }
  clearTimeout(resultPlayTO);
}

// Restore a previously-saved round for a difficulty. Returns false if
// that difficulty has no saved round yet (caller should start a fresh
// song in that case).
function restoreDiffState(d){
  const st=diffStates[d];
  if(!st) return false;
  stopAudio();
  // Stop any result-card auto-play from the previous difficulty
  if(resultAudio){ resultAudio.pause(); resultAudio=null; }
  clearTimeout(resultPlayTO);
  curSong=st.curSong; guesses=[...st.guesses]; clipIdx=st.clipIdx;
  audio=null;
  // Restore gameFinished based on whether that round was actually done
  gameFinished = st.finished;
  buildWave();buildClips();updateClips();renderGuesses();buildSearch();
  if(st.finished){
    document.getElementById('game-area').style.display='none';
    const ra=document.getElementById('result-area');
    ra.style.display='block';
    ra.innerHTML=st.resultHTML;
    // Restore the 15s pill state if finished
    document.querySelectorAll('.cp').forEach((b,i)=>{
      b.className='cp on'+(i===DIFFS[d].clips.length-1?' cur':'');
    });
    document.getElementById('ttot').textContent='of 15s';
    document.getElementById('tcur').textContent='0.0s';
    // Do NOT auto-play when switching back — only auto-play once on first finish
  }else{
    // Not finished — make sure gameFinished is false so play button works normally
    gameFinished=false;
    document.getElementById('game-area').style.display='block';
    document.getElementById('result-area').style.display='none';
    setStatus('Press play to start');
  }
  return true;
}

async function startGame(){
  stopAudio();
  gameFinished=false;
  if(resultAudio){ resultAudio.pause(); resultAudio=null; }
  clearTimeout(resultPlayTO);
  if(!songPool.length){
    const ok=await loadPool();
    if(!ok)return;
  }
  curSong=pickSong();
  audio=null; // reset audio object for new song
  clipIdx=0;guesses=[];
  buildWave();buildClips();updateClips();renderGuesses();buildSearch();
  document.getElementById('game-area').style.display='block';
  document.getElementById('result-area').style.display='none';
  setStatus('Press play to start');
}

async function nextSong(){
  if(!songPool.length) await loadPool();
  startGame();
}

// Reroll: swap in a different song at the same difficulty/genre/era.
// Doesn't touch score/streak/played — it's not a completed round, just
// "give me another one".
async function reroll(){
  await startGame();
}

// Reroll All: same idea, but clears every difficulty's saved round so
// each one deals a fresh song the next time you visit it, not just the
// tab you're currently on.
async function rerollAll(){
  diffStates={};
  pickQueues={};
  // Rotate the song pool so we don't start from the same position
  if(songPool.length > 1){
    const rotate = Math.floor(songPool.length * 0.3) + Math.floor(Math.random() * songPool.length * 0.4);
    songPool = [...songPool.slice(rotate), ...songPool.slice(0, rotate)];
  }
  await startGame();
}

function setDiff(d){
  selDiff=d;
  document.querySelectorAll('.diff-pill').forEach(b=>b.classList.toggle('active',b.dataset.d===d));
  document.getElementById('diff-hint').textContent=DIFFS[d].hint;
}

// ── Events ──────────────────────────────────────────────────────
document.getElementById('sel-genre').onchange=async e=>{
  selGenre=e.target.value;songPool=[];await loadPool();startGame();
};
document.getElementById('sel-era').onchange=async e=>{
  selEra=e.target.value;songPool=[];await loadPool();startGame();
};
document.getElementById('excl-roots').onchange=async e=>{
  exclRoots=e.target.checked;songPool=[];await loadPool();startGame();
};
document.getElementById('diff-row').onclick=e=>{
  const p=e.target.closest('.diff-pill');
  if(!p) return;
  const newDiff=p.dataset.d;
  if(newDiff===selDiff) return;
  saveCurrentDiffState();
  stopAudio();
  gameFinished=false; // always reset so switching diff never leaks 15s mode
  setDiff(newDiff);
  if(!restoreDiffState(newDiff)){
    startGame();
  }
};
document.querySelectorAll('.start-btn').forEach(b=>{
  b.onclick=()=>{
    const newOffset=parseInt(b.dataset.s);
    if(newOffset===startOffset) return;
    startOffset=newOffset;
    document.querySelectorAll('.start-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    // Load a fresh song so players can't cheat by switching modes
    songPool=[];
    startGame();
  };
});
document.getElementById('pbtn').onclick=playClip;
document.getElementById('volume').oninput=e=>{
  volume=e.target.value/100;
  if(audio) audio.volume=volume;
};
document.getElementById('breroll').onclick=reroll;
document.getElementById('brerollall').onclick=rerollAll;
document.getElementById('bskip').onclick=skip;
document.getElementById('bguess').onclick=doGuess;
document.getElementById('ginput').addEventListener('keydown',e=>{if(e.key==='Enter')doGuess();});
document.addEventListener('click',e=>{
  const dd=document.getElementById('sdrop');
  if(dd&&!dd.contains(e.target)&&e.target!==document.getElementById('ginput'))dd.style.display='none';
});

// ── Init ─────────────────────────────────────────────────────────
(async()=>{
  setDiff('easy');
  await loadPool();
  startGame();
})();
</script>
</body>
